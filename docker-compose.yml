services:
  # ------------------------------------------------------------------
  # PostgreSQL database (Sprint 4)
  # ------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ziza-db
    environment:
      POSTGRES_USER: ziza
      POSTGRES_PASSWORD: "${DB_PASSWORD:-ziza-local}"
      POSTGRES_DB: ziza
    ports:
      - "5432:5432"
    volumes:
      - ziza_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziza -d ziza"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # DB migrations (Alembic — runs once then exits)
  # ------------------------------------------------------------------
  migrate:
    build:
      context: ./apps/api
    container_name: ziza-migrate
    command: alembic upgrade head
    environment:
      DATABASE_URL: "postgresql+asyncpg://ziza:${DB_PASSWORD:-ziza-local}@db:5432/ziza"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------------
  # API
  # ------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
    container_name: ziza-api
    environment:
      ENVIRONMENT: dev
      CORS_ORIGINS_RAW: "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004"
      PORT: "8000"
      AUTH_DEV_SECRET: "${AUTH_DEV_SECRET:-dev-secret-change-me}"
      AUTH_DEV_PASSWORD: "${AUTH_DEV_PASSWORD:-ziza2024}"
      DATABASE_URL: "postgresql+asyncpg://ziza:${DB_PASSWORD:-ziza-local}@db:5432/ziza"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # Frontends
  # ------------------------------------------------------------------
  web-landing:
    build:
      context: ./apps/web-landing
    container_name: ziza-web-landing
    environment:
      PORT: "8080"
      ZIZA_DRIVER_URL: "http://localhost:3002"
      ZIZA_CUSTOMER_URL: "http://localhost:3001"
      ZIZA_CRAFT_URL: "http://localhost:3004"
      ZIZA_API_URL: "http://localhost:8000"
    ports:
      - "3000:8080"

  web-customer:
    build:
      context: ./apps/web-customer
      args:
        VITE_API_URL: http://localhost:8000
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    container_name: ziza-web-customer
    environment:
      PORT: "8080"
    ports:
      - "3001:8080"
    depends_on:
      api:
        condition: service_healthy

  web-driver:
    build:
      context: ./apps/web-driver
      args:
        VITE_API_URL: http://localhost:8000
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    container_name: ziza-web-driver
    environment:
      PORT: "8080"
    ports:
      - "3002:8080"
    depends_on:
      api:
        condition: service_healthy

  web-admin:
    build:
      context: ./apps/web-admin
      args:
        VITE_API_URL: http://localhost:8000
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    container_name: ziza-web-admin
    environment:
      PORT: "8080"
    ports:
      - "3003:8080"
    depends_on:
      api:
        condition: service_healthy

  web-craft:
    build:
      context: ./apps/web-craft
      args:
        VITE_API_URL: http://localhost:8000
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    container_name: ziza-web-craft
    environment:
      PORT: "8080"
    ports:
      - "3004:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ziza_pgdata:
