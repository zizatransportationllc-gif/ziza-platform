services:
  api:
    build:
      context: ./apps/api
    container_name: ziza-api
    environment:
      ENVIRONMENT: dev
      CORS_ORIGINS_RAW: "http://localhost:3001,http://localhost:3002,http://localhost:3003"
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  web-customer:
    build:
      context: ./apps/web-customer
      args:
        VITE_API_URL: http://localhost:8000
    container_name: ziza-web-customer
    environment:
      PORT: "8080"
    ports:
      - "3001:8080"
    depends_on:
      api:
        condition: service_healthy

  web-driver:
    build:
      context: ./apps/web-driver
      args:
        VITE_API_URL: http://localhost:8000
    container_name: ziza-web-driver
    environment:
      PORT: "8080"
    ports:
      - "3002:8080"
    depends_on:
      api:
        condition: service_healthy

  web-admin:
    build:
      context: ./apps/web-admin
      args:
        VITE_API_URL: http://localhost:8000
    container_name: ziza-web-admin
    environment:
      PORT: "8080"
    ports:
      - "3003:8080"
    depends_on:
      api:
        condition: service_healthy
