name: Deploy Dev (GCP Cloud Run)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_REGION: us-central1
  AR_REPO: ziza
  # Values from repo settings (vars):
  #   GCP_PROJECT_ID, WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT

jobs:
  # ------------------------------------------------------------------
  # Step 0: deploy gate — backend tests MUST pass before anything is
  # built, migrated, or deployed. A red suite now blocks the deployment.
  # ------------------------------------------------------------------
  test-gate:
    name: Backend tests (deploy gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: apps/api
        run: pytest

  # ------------------------------------------------------------------
  # Step 1: build and push images for all apps in parallel
  # ------------------------------------------------------------------
  build-push:
    name: Build & push ${{ matrix.app }}
    needs: test-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web-customer, web-driver, web-admin, web-landing, web-craft]
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.app }}:${{ steps.tag.outputs.tag }}"
          IMAGE_LATEST="${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.app }}:latest"

          if [ "${{ matrix.app }}" = "web-customer" ] || [ "${{ matrix.app }}" = "web-driver" ] || [ "${{ matrix.app }}" = "web-admin" ]; then
            BUILD_ARGS="--build-arg VITE_API_URL=${{ vars.ZIZA_API_URL }} --build-arg VITE_MAPBOX_TOKEN=${{ vars.VITE_MAPBOX_TOKEN }}"
          elif [ "${{ matrix.app }}" = "web-craft" ]; then
            BUILD_ARGS="--build-arg VITE_API_URL=${{ vars.ZIZA_API_URL }} --build-arg VITE_MAPBOX_TOKEN=${{ vars.VITE_MAPBOX_TOKEN }}"
          else
            BUILD_ARGS=""
          fi

          docker build $BUILD_ARGS -t "$IMAGE" -t "$IMAGE_LATEST" apps/${{ matrix.app }}
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"

  # ------------------------------------------------------------------
  # Step 2: run DB migrations via a Cloud Run Job (API image, alembic)
  # ------------------------------------------------------------------
  migrate:
    name: DB migrations (alembic)
    needs: build-push
    runs-on: ubuntu-latest
    # Skip if Cloud SQL is not configured
    if: vars.CLOUD_SQL_INSTANCE != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run alembic upgrade via Cloud Run Job
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/api:${GITHUB_SHA::7}"
          JOB_NAME="ziza-migrate-${GITHUB_SHA::7}"

          # 'gcloud run jobs create' uses --set-cloudsql-instances (not --add-)
          gcloud run jobs create "$JOB_NAME" \
            --image="$IMAGE" \
            --region="${{ env.GCP_REGION }}" \
            --command="alembic" \
            --args="upgrade,head" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-cloudsql-instances="${{ vars.CLOUD_SQL_INSTANCE }}" \
            --max-retries=1 \
            --task-timeout=120 \
            --quiet

          gcloud run jobs execute "$JOB_NAME" \
            --region="${{ env.GCP_REGION }}" \
            --wait \
            --quiet

          # Clean up the one-shot job after it completes
          gcloud run jobs delete "$JOB_NAME" \
            --region="${{ env.GCP_REGION }}" \
            --quiet || true

  # ------------------------------------------------------------------
  # Step 3: deploy each image to Cloud Run
  # ------------------------------------------------------------------
  deploy:
    name: Deploy ${{ matrix.app }}
    needs: [build-push, migrate]
    if: always() && needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web-customer, web-driver, web-admin, web-landing, web-craft]
    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Grant Cloud SQL client role to service account (API only)
        if: matrix.app == 'api' && vars.CLOUD_SQL_INSTANCE != ''
        run: |
          gcloud projects add-iam-policy-binding ${{ vars.GCP_PROJECT_ID }} \
            --member="serviceAccount:${{ vars.GCP_SERVICE_ACCOUNT }}" \
            --role="roles/cloudsql.client" \
            --condition=None \
            --quiet || echo "[WARN] Could not grant cloudsql.client — may already exist"

      - name: Deploy to Cloud Run
        run: |
          SERVICE="ziza-${{ matrix.app }}"
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.app }}:${GITHUB_SHA::7}"

          # Build flags array to avoid shell word-splitting on env var values
          FLAGS=(
            "--image=$IMAGE"
            "--region=${{ env.GCP_REGION }}"
            "--platform=managed"
            "--allow-unauthenticated"
            "--port=8080"
            "--cpu=1"
            "--memory=512Mi"
            "--min-instances=0"
            "--max-instances=2"
          )

          if [ "${{ matrix.app }}" = "api" ]; then
            # Use the deployment SA as the Cloud Run runtime SA so it inherits
            # the cloudsql.client role we just granted.
            FLAGS+=("--service-account=${{ vars.GCP_SERVICE_ACCOUNT }}")

            # Use ^|^ as separator so commas inside CORS_ORIGINS_RAW are preserved
            FLAGS+=(
              "--set-env-vars=^|^ENVIRONMENT=dev|AUTH_DEV_SECRET=${{ secrets.AUTH_DEV_SECRET }}|AUTH_DEV_PASSWORD=${{ vars.AUTH_DEV_PASSWORD }}|CORS_ORIGINS_RAW=${{ vars.ZIZA_CORS_ORIGINS }}|DATABASE_URL=${{ secrets.DATABASE_URL }}|MAPBOX_ACCESS_TOKEN=${{ vars.VITE_MAPBOX_TOKEN }}"
            )

            # Attach Cloud SQL unix socket proxy (requires cloudsql.client on SA)
            if [ -n "${{ vars.CLOUD_SQL_INSTANCE }}" ]; then
              FLAGS+=("--add-cloudsql-instances=${{ vars.CLOUD_SQL_INSTANCE }}")
            fi

          elif [ "${{ matrix.app }}" = "web-landing" ]; then
            # Deploy with placeholder URLs; the wire-landing-urls job (Step 4)
            # will overwrite them with the real Cloud Run service URLs once all
            # other services have been deployed.
            FLAGS+=(
              "--set-env-vars=^|^ZIZA_DRIVER_URL=pending|ZIZA_CUSTOMER_URL=pending|ZIZA_API_URL=pending"
            )
          fi

          gcloud run deploy "$SERVICE" "${FLAGS[@]}"

          URL=$(gcloud run services describe "$SERVICE" --region="${{ env.GCP_REGION }}" --format="value(status.url)")
          echo "::notice title=Deployed::$SERVICE → $URL"

  # ------------------------------------------------------------------
  # Step 4: wire the landing page to the live service URLs
  # Runs after all services are deployed; discovers the real Cloud Run
  # URLs (which contain an unpredictable hash) and injects them as env
  # vars on ziza-web-landing — no manual GitHub variables required.
  # ------------------------------------------------------------------
  wire-landing-urls:
    name: Wire landing page → live service URLs
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Discover service URLs and update ziza-web-landing
        run: |
          REGION="${{ env.GCP_REGION }}"

          CUSTOMER_URL=$(gcloud run services describe ziza-web-customer \
            --region="$REGION" --format="value(status.url)" 2>/dev/null || true)
          DRIVER_URL=$(gcloud run services describe ziza-web-driver \
            --region="$REGION" --format="value(status.url)" 2>/dev/null || true)
          API_URL=$(gcloud run services describe ziza-api \
            --region="$REGION" --format="value(status.url)" 2>/dev/null || true)

          if [ -z "$CUSTOMER_URL" ] || [ -z "$DRIVER_URL" ] || [ -z "$API_URL" ]; then
            echo "::warning::Could not resolve one or more service URLs — skipping landing URL update"
            exit 0
          fi

          echo "Customer : $CUSTOMER_URL"
          echo "Driver   : $DRIVER_URL"
          echo "API      : $API_URL"

          # Update env vars on the already-deployed landing service.
          # This triggers a new revision (same image, new env) so Nginx
          # regenerates env-config.js via envsubst at container startup.
          gcloud run services update ziza-web-landing \
            --region="$REGION" \
            --update-env-vars="^|^ZIZA_CUSTOMER_URL=${CUSTOMER_URL}|ZIZA_DRIVER_URL=${DRIVER_URL}|ZIZA_API_URL=${API_URL}" \
            --quiet

          LANDING_URL=$(gcloud run services describe ziza-web-landing \
            --region="$REGION" --format="value(status.url)")
          echo "::notice title=Landing wired::Customer→${CUSTOMER_URL} Driver→${DRIVER_URL} Landing→${LANDING_URL}"
