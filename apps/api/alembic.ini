# Alembic configuration — Ziza API
# Run from apps/api/: alembic upgrade head

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Prepend sys.path with this directory so `app.*` imports work
prepend_sys_path = .

# Template used for new migration files
file_template = %%(rev)s_%%(slug)s

# Truncate long filenames
truncate_slug_length = 40

# Timezone for "Generates" comment in new migration files
timezone = UTC

# sqlalchemy.url is set dynamically in env.py from DATABASE_URL env var
# Leaving it blank here; override via -x option if needed:
#   alembic -x db_url=postgresql+asyncpg://... upgrade head
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
